# Reconstruye la tienda en cada cambio (páginas de producto, sitemap, galería
# y versiones de caché). Así el panel /admin solo necesita tocar products.js
# y subir fotos: el resto sale solo.
name: Reconstruir tienda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-tienda
  cancel-in-progress: true

jobs:
  rebuild:
    # Evita el bucle: no corre sobre los commits que genera él mismo
    if: ${{ !contains(github.event.head_commit.message, '[auto-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reconstruir páginas
        run: node build/build-products.js

      - name: Publicar lo generado
        run: |
          git config user.name "mym-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Reconstrucción automática de la tienda [auto-build]"
          git push
